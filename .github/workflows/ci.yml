name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: openhackathon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/openhackathon_test?schema=public
      PG_ADMIN_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
      JWT_SECRET: ci-only-secret-change-in-prod
      AUTH_DISABLED: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: API tests
        run: npm run test:api

      - name: Build
        run: npm run build

      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
